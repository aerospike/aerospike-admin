[coverage:run]
disable_warnings = true
parallel = true

[coverage:report]
include = lib/*, asadm.py

[flake8]
max-line-length = 88
extend-ignore = E203, E501, E266
extend-exclude = build, .worktrees, htmlcov, test/unit/health/test_healthchecker.py
per-file-ignores =
    lib/health/query.py: W191, E101, W291, W293

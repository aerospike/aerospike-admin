name: FIPS Tests
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["dependabot/**"]
jobs:
  fips:
    name: FIPS e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@9d5fe0e81fc593a6c0c39bf83ad9a7b45587eed0 # v5.3.1
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-aerospike
          oidc-audience: database-gh-aerospike
      - name: Docker login to Artifactory
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}
      - name: Get Python version from Pipfile
        run: echo "PYTHON_VERSION=$(grep "python_version" Pipfile | cut -d ' ' -f 3  - | tr -d '"')" >> "$GITHUB_ENV"
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install pipenv==2026.8.0
          pipenv install --dev
      - name: asadm under a FIPS-mode OpenSSL
        env:
          FEATKEY: ${{ secrets.TEST_FEAT_KEY }}
        run: pipenv run make fips

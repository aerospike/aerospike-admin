name: "Draft Release"

on:
  push:
    tags:
      - "*"

jobs:
  # workflows to pull release artifacts from
  snyk-test:
    uses: aerospike/aerospike-admin/.github/workflows/snyk-test.yml@master
  draft-release-notes:
    needs: snyk-test
    runs-on: ubuntu-latest
    name: Draft Release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # below steps are for downloading release artifacts
      - name: Download Snyk Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asadm-snyk.txt
          path: artifacts
      # finally create the release and upload artifacts
      - name: Upload Artifacts to Release Draft
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*

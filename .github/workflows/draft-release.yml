name: "Draft Release"

on:
  push:
    tags:
      - "*"

jobs:
  # workflows to pull release artifacts from
  snyk-test:
    uses: aerospike/aerospike-admin/.github/workflows/snyk-test.yml@master
  draft-release-notes:
    needs: snyk-test
    runs-on: ubuntu-latest
    name: Draft Release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # below steps are for downloading release artifacts
      - name: Download Snyk Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asadm-snyk.txt
          path: artifacts
      # finally create the release and upload artifacts
      - name: Upload Artifacts to Release Draft
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*

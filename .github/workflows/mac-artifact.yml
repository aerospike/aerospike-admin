name: Mac Artifact

on:
  repository_dispatch:
    types: mac-build
  push:
    branches: [actionsHub, master, "bugfix-*"]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      submodule:
        description: The directory of the submodule, if this workflow is being called on a submodule
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [macos-15-intel, macos-14, macos-15, macos-26]  
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Get checkout directory
        uses: step-security/action-cond@6c9b559685e1bcd523fc000b3cc1272529f8810d # v1.2.5
        id: checkout-dir
        with:
          cond: ${{ inputs.submodule != '' }}
          if_true: aerospike-tools # In this case we are expecting to checkout the tools package.
          if_false: admin
      - name: Get asadm working directory
        uses: step-security/action-cond@6c9b559685e1bcd523fc000b3cc1272529f8810d # v1.2.5
        id: working-dir
        with:
          cond: ${{ inputs.submodule != '' }}
          if_true: aerospike-tools/${{ inputs.submodule }} # In this case we are expecting to checkout the tools package.
          if_false: admin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ steps.checkout-dir.outputs.value }}
          fetch-depth: 0
      - name: Checkout ${{ steps.working-dir.outputs.value }}
        working-directory: ${{ steps.checkout-dir.outputs.value }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive -- ${{ inputs.submodule || '.' }}
      - name: Print and get version
        working-directory: ${{ steps.working-dir.outputs.value }}
        id: tag
        run: |
          git describe --tags --always --abbrev=9
          echo "tag=$(git describe --tags --always --abbrev=9)" >> $GITHUB_OUTPUT
      - uses: kenchan0130/actions-system-info@59699597e84e80085a750998045983daa49274c4 # v1.4.0
        id: system-info
      - name: Get Python version from Pipfile
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          git rev-parse HEAD
          echo "PYTHON_VERSION=$(grep "python_version" Pipfile | cut -d ' ' -f 3  - | tr -d '"')" >> $GITHUB_ENV
          echo ${{ steps.system-info.outputs.name }}
          echo ${{ steps.system-info.outputs.kernel-release }}
          echo ${{ steps.system-info.outputs.platform }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache asadm and asinfo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-asadm-asinfo
        env:
          cache-name: cache-asadm-asinfo
          cache-index: "5"
        with:
          path: |
            ${{ steps.working-dir.outputs.value }}/build/bin
          key: ${{ env.cache-name }}-${{ env.cache-index }}-${{ matrix.os }}-${{ runner.arch }}-${{ steps.system-info.outputs.release }}-${{ env.PYTHON_VERSION }}-${{ steps.tag.outputs.tag }}
      - name: Get the macOS support floor
        # Read the floor from pkg/Makefile rather than repeating it here, so the
        # shipping bundle and the Intel compile below cannot drift apart.
        if: runner.arch == 'X64' && steps.cache-asadm-asinfo.outputs.cache-hit != 'true'
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          set -euo pipefail
          min_os=$(sed -n 's/^MACOS_MIN_VERSION[[:space:]]*=[[:space:]]*//p' pkg/Makefile)
          # Shape-check rather than just non-empty: the sed prints whatever
          # follows the "=", so a trailing inline comment or stray whitespace
          # would sail through and land in both the deployment target and the
          # cache key.
          [[ "${min_os}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::MACOS_MIN_VERSION malformed in pkg/Makefile: '${min_os}'" >&2; exit 1; }
          echo "MACOS_MIN_VERSION=${min_os}" >> "$GITHUB_ENV"
      - name: Cache static OpenSSL
        if: runner.arch == 'X64' && steps.cache-asadm-asinfo.outputs.cache-hit != 'true'
        id: cache-openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-static
          # hashFiles resolves against GITHUB_WORKSPACE, and this workflow
          # checks out into a subdirectory, so the path has to be qualified.
          # Unqualified it matches nothing, hashFiles returns "", and the key
          # degenerates to a constant that pins the OpenSSL build forever.
          # check_min_os.sh is hashed because build_static_openssl.sh runs it as
          # its own gate. Member minos is unrecoverable once the archives are
          # linked in, so that build-time scan is the only scan; a later fix to
          # the scanner has to re-run it rather than hit a cache validated by
          # the old one.
          key: openssl-static-${{ runner.arch }}-${{ env.MACOS_MIN_VERSION }}-${{ hashFiles(format('{0}/.github/bin/build_static_openssl.sh', steps.working-dir.outputs.value), format('{0}/.github/bin/check_min_os.sh', steps.working-dir.outputs.value)) }}
      - name: Build static OpenSSL
        if: runner.arch == 'X64' && steps.cache-asadm-asinfo.outputs.cache-hit != 'true' && steps.cache-openssl.outputs.cache-hit != 'true'
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: .github/bin/build_static_openssl.sh "$RUNNER_TEMP/openssl-static" "$MACOS_MIN_VERSION"
      - name: Static OpenSSL for the Intel cryptography build
        # cryptography publishes arm64-only macOS wheels from 49.0.0 on, so the
        # Intel leg builds it from the sdist instead. PyInstaller flattens
        # vendored dylibs by base name, where Python's own _ssl and _hashlib
        # already put a libssl.3.dylib, so a dynamically linked cryptography
        # collides with them and loses. Linking it statically keeps it out of
        # that collision entirely.
        if: runner.arch == 'X64' && steps.cache-asadm-asinfo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Confirm the prefix really holds an archive before exporting it: an
          # empty or half-built OPENSSL_DIR would reach openssl-sys as a real
          # prefix and fail much further downstream.
          openssl_dir="$RUNNER_TEMP/openssl-static"
          [[ -f "${openssl_dir}/lib/libcrypto.a" ]] || { echo "::error::no static OpenSSL at ${openssl_dir}" >&2; exit 1; }
          echo "OPENSSL_DIR=${openssl_dir}" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOS_MIN_VERSION}" >> "$GITHUB_ENV"
      - name: Pipenv setup
        if: steps.cache-asadm-asinfo.outputs.cache-hit != 'true'
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          brew install pipenv
          pipenv install --dev
      - name: Build asadm
        if: steps.cache-asadm-asinfo.outputs.cache-hit != 'true'
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          make one-dir
          ls -al build/bin/asadm || true
      - name: Check cryptography links OpenSSL statically
        # Deliberately not gated on the build cache: a restored bundle ships
        # exactly like a freshly built one, so it has to clear the same bar.
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: .github/bin/check_crypto_static_openssl.sh build/bin
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      - name: Sanity Test tools
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          sudo make install
          asadm -e "info" || true
          asadm -e "info" 2>&1 | grep "Not able to connect"
          asinfo || true
          asinfo 2>&1 | grep "Not able to connect"
      - name: Create .tar
        working-directory: ${{ steps.working-dir.outputs.value }}
        run: |
          tar -C build/bin/ -cvf asadm.tar asadm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.system-info.outputs.platform }}-${{ runner.arch }}-${{ matrix.os }}-${{ steps.system-info.outputs.release }}-asadm
          path: ${{ steps.working-dir.outputs.value }}/asadm.tar
          if-no-files-found: error

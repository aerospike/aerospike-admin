# Lightweight installer build check.
#
# Purpose: catch dependency / packaging regressions on every push, before
# they reach the full release pipeline. The release workflow builds for 11
# distros × 2 arches + signing + notarization — too heavy for every commit.
#
# This workflow exercises both fpm code paths (deb on Ubuntu, rpm on EL) on
# amd64 so a regression in either format surfaces early. macOS pkg builds
# are deferred to the release workflow (macOS runners are ~10x more
# expensive and pkg/Makefile changes are infrequent).
#
# tests.yml verifies the binary build via `make`. This adds coverage for
# the *packaging* step (install_deps → make → fpm).
#
# It also runs the naming/version scripts' own unit tests. Those scripts are
# otherwise exercised only by build-and-release.yml, which is
# workflow_dispatch-only, so a regression in version_lib.sh -- which gates
# whether a mis-stamped binary ships -- would first be observed during a real
# release. They run against strings, so they need no container and no package.

name: Build check (installer)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

# /bin/sh is dash on Debian/Ubuntu; force bash for `set -o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  naming-scripts:
    name: Naming scripts (version_lib)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the version assertions
        run: bash .github/bin/test/version_lib_test.sh

  installer-build:
    name: Build .${{ matrix.pkg }} (${{ matrix.distro }}, amd64)
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu24.04, container: 'ubuntu:noble-20251013', pkg: deb }
          - { distro: ubuntu26.04, container: 'ubuntu:resolute-20260421', pkg: deb }
          - { distro: el10,        container: 'redhat/ubi10:10.0',    pkg: rpm }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install prereqs
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              ;;
            el*|amzn*)
              dnf -y install git ca-certificates
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Mark workspace as safe (for git inside container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/bin/install_deps.sh
          install_deps "${{ matrix.distro }}"

      - name: Build .${{ matrix.pkg }} installer
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          BUILD_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          export PATH="$PATH:/opt/golang/go/bin"
          source .github/bin/build_package.sh
          build_packages

      - name: Verify .${{ matrix.pkg }} produced
        run: |
          set -euo pipefail
          count=$(find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No .${{ matrix.pkg }} produced under pkg/target/." >&2
            ls -la pkg/target/ || true
            exit 1
          fi
          echo "Installer build succeeded:"
          find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f

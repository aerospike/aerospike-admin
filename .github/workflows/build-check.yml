# Lightweight installer build check.
#
# Purpose: catch dependency / packaging regressions on every push, before
# they reach the full release pipeline. The release workflow builds for 11
# distros × 2 arches + signing + notarization — too heavy for every commit.
#
# This workflow exercises both fpm code paths (deb on Ubuntu, rpm on EL) on
# amd64 so a regression in either format surfaces early. macOS pkg builds
# are deferred to the release workflow (macOS runners are ~10x more
# expensive and pkg/Makefile changes are infrequent).
#
# tests.yml verifies the binary build via `make`. This adds coverage for
# the *packaging* step (install_deps → make → fpm).
#
# It also runs the naming/version scripts' own unit tests. Those scripts are
# otherwise exercised only by build-and-release.yml, which is
# workflow_dispatch-only, so a regression in version_lib.sh -- which gates
# whether a mis-stamped binary ships -- would first be observed during a real
# release. They run against strings, so they need no container and no package.

name: Build check (installer)

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

permissions:
  contents: read

# /bin/sh is dash on Debian/Ubuntu; force bash for `set -o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  naming-scripts:
    name: Naming scripts (version_lib)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test the version assertions
        run: bash .github/bin/test/version_lib_test.sh


      - name: Install bats
        env:
          BATS_VERSION: "1.11.0"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" -o /tmp/bats.tgz
          tar -xzf /tmp/bats.tgz -C /tmp
          sudo "/tmp/bats-core-${BATS_VERSION}/install.sh" /usr/local
          bats --version

      - name: Test pkg_release.sh
        run: bats .github/bin/test/pkg_release.bats

      # The .deb/.rpm legs below only count that a package appeared; nothing
      # asserts the NAME. Assert it here, where the expected name is derived
      # from the same script pkg/Makefile uses, so the two cannot drift.
      - name: Assert package names for an rc version
        run: |
          set -euo pipefail
          release=$(.github/bin/pkg_release.sh 5.0.4-rc3 release)
          pkg_version=$(.github/bin/pkg_release.sh 5.0.4-rc3 version)
          iteration=$(.github/bin/pkg_release.sh 5.0.4-rc3 iteration)
          [[ "${release}" == "5.0.4-3" ]] || { echo "::error::rc3 resolved to release '${release}', expected 5.0.4-3" >&2; exit 1; }

          # make -n so no build deps are needed. Collect only the emitted
          # --package paths: the rest of the output includes recipe text that
          # legitimately echoes the rcN version.
          names=$(make -C pkg -n deb rpm tar VERSION=5.0.4-rc3 BUILD_DISTRO=ubuntu24.04 \
                  | tr ' ' '\n' | grep -E '\.(deb|rpm|tar)$')
          echo "${names}"
          for want in \
            "_${pkg_version}-${iteration}ubuntu24.04_" \
            "-${pkg_version}-${iteration}.ubuntu24.04." \
            "-${release}-ubuntu24.04-"; do
            printf '%s\n' "${names}" | grep -qF -- "${want}" \
              || { echo "::error::expected '${want}' in the emitted package names" >&2; exit 1; }
          done
          if printf '%s\n' "${names}" | grep -qiE 'rc[0-9]'; then
            echo "::error::an rc identifier leaked into a package name" >&2
            exit 1
          fi
          echo "OK: rcN folded into the iteration, absent from all package names"

          # dpkg spells architectures differently from uname and rpm, so assert
          # the mapping rather than trusting whatever arch the runner reports.
          amd=$(make -C pkg -n deb rpm VERSION=5.0.4-rc3 BUILD_DISTRO=ubuntu24.04 ARCH=x86_64 \
                | tr ' ' '\n' | grep -E '\.(deb|rpm)$')
          arm=$(make -C pkg -n deb rpm VERSION=5.0.4-rc3 BUILD_DISTRO=ubuntu24.04 ARCH=aarch64 \
                | tr ' ' '\n' | grep -E '\.(deb|rpm)$')
          for want in "_amd64.deb" ".x86_64.rpm"; do
            printf '%s\n' "${amd}" | grep -qF -- "${want}" \
              || { echo "::error::ARCH=x86_64 did not emit '${want}': ${amd}" >&2; exit 1; }
          done
          for want in "_arm64.deb" ".aarch64.rpm"; do
            printf '%s\n' "${arm}" | grep -qF -- "${want}" \
              || { echo "::error::ARCH=aarch64 did not emit '${want}': ${arm}" >&2; exit 1; }
          done
          echo "OK: deb names carry the dpkg architecture, rpm names the uname one"

  installer-build:
    name: Build .${{ matrix.pkg }} (${{ matrix.distro }}, amd64)
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu24.04, container: 'ubuntu:noble-20251013', pkg: deb }
          - { distro: ubuntu26.04, container: 'ubuntu:resolute-20260421', pkg: deb }
          - { distro: el10,        container: 'redhat/ubi10:10.0',    pkg: rpm }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Install prereqs
        run: |
          set -euo pipefail
          case "${{ matrix.distro }}" in
            ubuntu*|debian*)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              ;;
            el*|amzn*)
              dnf -y install git ca-certificates
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Mark workspace as safe (for git inside container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          source .github/bin/install_deps.sh
          install_deps "${{ matrix.distro }}"

      - name: Build .${{ matrix.pkg }} installer
        env:
          ENV_DISTRO: ${{ matrix.distro }}
          BUILD_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          export PATH="$PATH:/opt/golang/go/bin"
          source .github/bin/build_package.sh
          build_packages

      - name: Verify .${{ matrix.pkg }} produced
        run: |
          set -euo pipefail
          count=$(find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No .${{ matrix.pkg }} produced under pkg/target/." >&2
            ls -la pkg/target/ || true
            exit 1
          fi
          echo "Installer build succeeded:"
          find pkg/target -maxdepth 2 -name "*.${{ matrix.pkg }}" -type f

  docker-lint:
    name: Docker image lint (hadolint, shellcheck, tag policy)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Lint the Dockerfile
        run: |
          set -euo pipefail
          docker run --rm -i hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e hadolint - < docker/Dockerfile

      - name: Lint the docker shell scripts
        run: shellcheck docker/docker-entrypoint.sh docker/docker-build.sh

      # The rolling tags mean "the current GA release", so the guard that keeps
      # a pre-release from moving them is asserted here rather than discovered
      # during a release.
      - name: Assert the rolling-tag policy
        run: |
          set -euo pipefail
          if docker/docker-build.sh -p -v 9.9.9-rc1 -N -L >/dev/null 2>&1; then
            echo "::error::--latest accepted a pre-release version" >&2
            exit 1
          fi
          ga=$(docker/docker-build.sh -p -v 9.9.9 -N -L)
          for want in "aerospike-asadm:latest" "aerospike-asadm:9" "aerospike-asadm:9.9"; do
            grep -qF -- "${want}" <<<"${ga}" \
              || { echo "::error::GA bake file is missing tag ${want}" >&2; exit 1; }
          done
          rc=$(docker/docker-build.sh -p -v 9.9.9-rc1 -N)
          if grep -qF -- "aerospike-asadm:latest" <<<"${rc}"; then
            echo "::error::a pre-release bake file carries the latest tag" >&2
            exit 1
          fi
          echo "OK: latest / major / major.minor are GA-only"

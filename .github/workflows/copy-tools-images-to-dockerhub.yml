name: Copy aerospike-asadm images to Docker Hub

# Copies already-published aerospike-asadm tags from JFrog to Docker Hub.
# Does not build images and does not write anything back to Artifactory.
#
# Default tags come from the VERSION file, not a hard-coded string.
# VERSION is MAJOR.MINOR.PATCH with an optional -rcN (e.g. 5.0.3-rc5).
# Only the three-digit semver is used for Hub aliases; pkg_release.sh
# folds rcN into the image tag (5.0.3-rc5 -> 5.0.3-5):
#   tags:       <release>, <release>-amd64, <release>-arm64
#   alias-from: <release>
#   alias-tags: <MAJOR.MINOR.PATCH>, latest
# Derived tags require git tag <VERSION>. Pass explicit tags to copy a
# different set. alias-tags of "none" skips Hub aliases.
#
# For 5.1.0 GA snapshot: tags=5.1.0-2_20260922T163439Z,
# alias-from=5.1.0-2_20260922T163439Z, alias-tags=5.1.0,latest.

on:
  workflow_dispatch:
    inputs:
      source-image:
        description: Source image without tag
        required: true
        default: artifact.aerospike.io/docker/aerospike-asadm
      dest-image:
        description: Destination Docker Hub image without tag
        required: true
        default: aerospike/aerospike-asadm
      tags:
        description: Comma-separated tags to copy unchanged (index, linux/amd64, linux/arm64). Empty = derive from VERSION (requires git tag VERSION).
        required: false
        default: ""
      dry-run:
        description: Inspect JFrog tags only; do not push to Docker Hub
        type: boolean
        required: false
        default: true
      alias-from:
        description: Source tag to copy onto extra destination tags. Empty = VERSION release tag.
        required: false
        default: ""
      alias-tags:
        description: Extra destination tags based on alias-from. Empty = "<semver>,latest". "none" disables aliases.
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  copy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Resolve tags from VERSION
        id: resolve
        env:
          TAGS_INPUT: ${{ inputs.tags }}
          ALIAS_FROM_INPUT: ${{ inputs.alias-from }}
          ALIAS_TAGS_INPUT: ${{ inputs.alias-tags }}
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing at repo root." >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "::error::VERSION '$VERSION' does not start with MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          SEMVER="${BASH_REMATCH[1]}"
          PKG_VERSION=$(.github/bin/pkg_release.sh "$VERSION" version)
          RELEASE=$(.github/bin/pkg_release.sh "$VERSION" release)

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          tags="$(trim "${TAGS_INPUT:-}")"
          if [[ -z "$tags" ]]; then
            if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::VERSION ${VERSION} has no release tag — pass explicit tags or dispatch on the release tag." >&2
              exit 1
            fi
            tags="${RELEASE},${RELEASE}-amd64,${RELEASE}-arm64"
          fi

          alias_from="$(trim "${ALIAS_FROM_INPUT:-}")"
          if [[ -z "$alias_from" ]]; then
            alias_from="$RELEASE"
          fi

          alias_tags="$(trim "${ALIAS_TAGS_INPUT:-}")"
          if [[ "$alias_tags" == "none" || "$alias_tags" == "-" ]]; then
            alias_tags=""
          elif [[ -z "$alias_tags" ]]; then
            if [[ "$PKG_VERSION" != "$SEMVER" ]]; then
              echo "::error::VERSION '$VERSION' carries a non-rc pre-release identifier; pass alias-tags explicitly (or 'none')." >&2
              exit 1
            fi
            alias_tags="${SEMVER},latest"
          fi

          {
            echo "version=$VERSION"
            echo "semver=$SEMVER"
            echo "release=$RELEASE"
            echo "tags=$tags"
            echo "alias-from=$alias_from"
            echo "alias-tags=$alias_tags"
          } >> "$GITHUB_OUTPUT"

          echo "VERSION file: $VERSION"
          echo "semver:       $SEMVER"
          echo "release tag:  $RELEASE"
          echo "tags:         $tags"
          echo "alias-from:   $alias_from"
          echo "alias-tags:   $alias_tags"

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: database
        with:
          version: 2.78.8
          oidc-provider-name: database-gh-aerospike
          oidc-audience: database-gh-aerospike

      - name: Docker login to Artifactory (pull only)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Docker login to Docker Hub
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ vars.AEROSPIKE_DOCKER_ORG_NAME || 'aerospike' }}
          password: ${{ secrets.AEROSPIKE_DOCKER_ORG_RW_TOKEN }}

      - uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Copy existing tags to Docker Hub
        id: copy
        shell: bash
        env:
          SOURCE_IMAGE: ${{ inputs.source-image }}
          DEST_IMAGE: ${{ inputs.dest-image }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          DRY_RUN: ${{ inputs.dry-run }}
          ALIAS_FROM: ${{ steps.resolve.outputs.alias-from }}
          ALIAS_TAGS: ${{ steps.resolve.outputs.alias-tags }}
          VERSION_FILE: ${{ steps.resolve.outputs.version }}
          SEMVER: ${{ steps.resolve.outputs.semver }}
          RELEASE: ${{ steps.resolve.outputs.release }}
        run: |
          set -euo pipefail

          # Registry-to-registry copy of already-published tags.
          # Do not docker build, do not docker push to Artifactory.
          copy_tag() {
            local src="$1"
            local dest="$2"
            docker buildx imagetools create --tag "$dest" "$src"
          }

          inspect_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest'
          }

          tags_array=()
          IFS=',' read -ra raw_tags <<< "$TAGS"
          for tag in "${raw_tags[@]}"; do
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [ -z "$tag" ] && continue
            tags_array+=("$tag")
          done

          if [ "${#tags_array[@]}" -eq 0 ]; then
            echo "::error::no tags parsed from input '$TAGS'"
            exit 1
          fi

          copied=()
          source_digests=()

          {
            echo "## Docker copy"
            echo ""
            echo "- VERSION file: \`$VERSION_FILE\`"
            echo "- Semver: \`$SEMVER\`"
            echo "- Release tag: \`$RELEASE\`"
            echo "- Source: \`$SOURCE_IMAGE\`"
            echo "- Destination: \`$DEST_IMAGE\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo ""
            echo "| Tag | Source digest | Destination digest |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for tag in "${tags_array[@]}"; do
            src="${SOURCE_IMAGE}:${tag}"
            dest="${DEST_IMAGE}:${tag}"

            echo "::group::Inspect source ${src}"
            docker buildx imagetools inspect "$src"
            src_digest="$(inspect_digest "$src")"
            if [ -z "$src_digest" ] || [ "$src_digest" = "null" ]; then
              echo "::error::could not read digest for $src"
              exit 1
            fi
            echo "source digest: $src_digest"
            echo "::endgroup::"
            source_digests+=("${tag}@${src_digest}")

            dest_digest=""
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run: skipping copy of $src -> $dest"
              dest_digest="(skipped)"
            else
              echo "::group::Copy ${src} -> ${dest}"
              copy_tag "$src" "$dest"
              dest_digest="$(inspect_digest "$dest")"
              echo "destination digest: $dest_digest"
              echo "::endgroup::"

              if [ "$src_digest" != "$dest_digest" ]; then
                echo "::error::digest mismatch for tag ${tag}: source=${src_digest} dest=${dest_digest}"
                exit 1
              fi
              copied+=("${dest}@${dest_digest}")
            fi

            echo "| \`${tag}\` | \`${src_digest}\` | \`${dest_digest}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          alias_tags_array=()
          IFS=',' read -ra raw_aliases <<< "${ALIAS_TAGS:-}"
          for tag in "${raw_aliases[@]}"; do
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [ -z "$tag" ] && continue
            alias_tags_array+=("$tag")
          done

          if [ "${#alias_tags_array[@]}" -gt 0 ]; then
            alias_from="${ALIAS_FROM:-}"
            alias_from="${alias_from#"${alias_from%%[![:space:]]*}"}"
            alias_from="${alias_from%"${alias_from##*[![:space:]]}"}"
            if [ -z "$alias_from" ]; then
              echo "::error::alias-tags was set but alias-from is empty"
              exit 1
            fi

            src="${SOURCE_IMAGE}:${alias_from}"
            echo "::group::Inspect alias source ${src}"
            docker buildx imagetools inspect "$src"
            src_digest="$(inspect_digest "$src")"
            if [ -z "$src_digest" ] || [ "$src_digest" = "null" ]; then
              echo "::error::could not read digest for $src"
              exit 1
            fi
            echo "source digest: $src_digest"
            echo "::endgroup::"

            for tag in "${alias_tags_array[@]}"; do
              dest="${DEST_IMAGE}:${tag}"
              dest_digest=""
              if [ "$DRY_RUN" = "true" ]; then
                echo "dry-run: skipping alias $src -> $dest"
                dest_digest="(skipped)"
              else
                echo "::group::Copy alias ${src} -> ${dest}"
                copy_tag "$src" "$dest"
                dest_digest="$(inspect_digest "$dest")"
                echo "destination digest: $dest_digest"
                echo "::endgroup::"

                if [ "$src_digest" != "$dest_digest" ]; then
                  echo "::error::digest mismatch for alias ${tag}: source=${src_digest} dest=${dest_digest}"
                  exit 1
                fi
                copied+=("${dest}@${dest_digest}")
              fi

              echo "| \`${tag}\` (from \`${alias_from}\`) | \`${src_digest}\` | \`${dest_digest}\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          IFS=','
          echo "copied-tags=${copied[*]}" >> "$GITHUB_OUTPUT"
          echo "source-digests=${source_digests[*]}" >> "$GITHUB_OUTPUT"

name: "Snyk Report"

on:
  workflow_call:
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with: 
          snyk-version: v1.1297.3
      - name: Get Python version from Pipfile
        run: |
          echo "PYTHON_VERSION=$(grep "python_version" Pipfile | cut -d ' ' -f 3  - | tr -d '"')" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pipenv setup
        run: |
          pip install pipenv
          pipenv install
      - name: Run Snyk to check for vulnerabilities and record dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SNYK_TOKEN:-}" ]] \
            || { echo "::error::SNYK_TOKEN is not set, so asadm-snyk.txt would hold an authentication error instead of a report" >&2; exit 1; }
          rc=0
          snyk test --print-deps > snyk-raw.txt || rc=$?
          sed -r "s/\x1B\[([0-9]{1,3}((;[0-9]{1,3})*)?)?[m|K]//g" snyk-raw.txt | tee asadm-snyk.txt
          case "${rc}" in
            0|1) ;;
            *) echo "::error::snyk test exited ${rc} without a result, so asadm-snyk.txt is not a report" >&2; exit 1 ;;
          esac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload snyk results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asadm-snyk.txt
          path: asadm-snyk.txt
